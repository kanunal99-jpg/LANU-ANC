name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Write build manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA="${{ steps.sha.outputs.sha256 }}"
          {
            echo "LANU ANC debug build"
            echo "Commit: $GITHUB_SHA"
            echo "APK: app-debug.apk"
            echo "SHA-256: $SHA"
          } > build-manifest.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-anc-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-manifest.txt
          if-no-files-found: error
          retention-days: 30
