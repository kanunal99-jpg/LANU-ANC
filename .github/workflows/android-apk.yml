name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-ear-test-evidence-${{ github.run_number }}
          path: |
            app/build/test-results/
            diagnostics/
          if-no-files-found: warn
      - name: Prepare versioned APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/LANU-Tek-Kulaklik-1.1.0.apk
          sha256sum release/LANU-Tek-Kulaklik-1.1.0.apk > release/SHA256SUMS.txt
          {
            echo "LANU Tek Kulaklik 1.1.0"
            echo "Commit: $GITHUB_SHA"
            echo "Build type: debug / installable development APK"
            echo "Validation: build, unit tests, Android 35 emulator smoke"
            echo "Physical phone/headset audio quality: not verified by CI"
            echo "Scope: local mono microphone monitor; no cellular/WhatsApp filtering or physical ANC"
          } > release/build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-single-ear-apk-${{ github.run_number }}
          path: release/
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.0 release/LANU-Tek-Kulaklik-1.1.0.apk release/SHA256SUMS.txt release/build-manifest.txt \
            --target "$GITHUB_SHA" --title 'LANU Tek Kulaklık 1.1.0' \
            --notes-file docs/SINGLE_EAR_1.1.0.md --prerelease
