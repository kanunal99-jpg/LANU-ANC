name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  APK_REPO_PATH: downloads/LANU-ANC-debug.apk
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Write build manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA="${{ steps.sha.outputs.sha256 }}"
          {
            echo "LANU ANC debug build"
            echo "Commit: $GITHUB_SHA"
            echo "APK: $APK_REPO_PATH"
            echo "SHA-256: $SHA"
          } > build-manifest.txt

      - name: Verify APK package exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s build-manifest.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-anc-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_REPO_PATH")"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_REPO_PATH"
          cp build-manifest.txt downloads/LANU-ANC-debug-build-manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK_REPO_PATH" downloads/LANU-ANC-debug-build-manifest.txt
          if git diff --cached --quiet; then
            echo "No repository APK change to publish."
            exit 0
          fi
          git commit -m "build: publish downloadable APK [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0"
          TITLE="LANU ANC v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "build-manifest.txt" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "LANU ANC verified debug build. Commit: $GITHUB_SHA. SHA-256: ${{ steps.sha.outputs.sha256 }}. This release is a development build; performance claims require physical-device measurements."
