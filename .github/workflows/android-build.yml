name: Android Build & Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LANU-ANC-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          mkdir -p downloads
          cp "$APK" downloads/LANU-ANC.apk
          SHA="$(sha256sum downloads/LANU-ANC.apk | awk '{print $1}')"
          cat > downloads/LANU-ANC-build-manifest.txt <<EOF
          LANU ANC Android build
          Commit: $GITHUB_SHA
          APK: downloads/LANU-ANC.apk
          SHA-256: $SHA
          Version: 1.0.0
          Build type: debug / installable development build
          Physical ANC validation: requires real two-channel hardware test
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/LANU-ANC.apk downloads/LANU-ANC-build-manifest.txt
          git diff --cached --quiet || git commit -m "build: publish LANU ANC v1.0.0 APK [skip ci]"
          git push
