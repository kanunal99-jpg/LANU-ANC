name: One-time native ANC migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Show migration status
        run: |
          echo "Native ANC migration is already applied on main."
          echo "Use the dedicated migration workflow manually only when intentionally resetting the migration state."
