name: Apply native ANC migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply native ANC migration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/apply-native-anc-migration.sh
          bash scripts/apply-native-anc-migration.sh

      - name: Commit native ANC migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/lanu/anc/HardwareCalibrationController.kt \
            app/src/main/java/com/lanu/anc/NativeAudioEngine.kt \
            app/src/main/java/com/lanu/anc/AudioEngine.kt \
            app/src/main/java/com/lanu/anc/AudioProcessingService.kt \
            app/src/main/cpp/native_audio_engine.cpp
          if git diff --cached --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git commit -m "feat: connect measured dual-channel FxLMS to native AAudio [skip ci]"
          git push origin HEAD:main
